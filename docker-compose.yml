services:
  db:
    image: postgres:16
    container_name: cozy-cabin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cozy
      POSTGRES_PASSWORD: cozy_password
      POSTGRES_DB: cozy_cabin
    ports:
      - "3002:5432"
    volumes:
      - cozy_cabin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cozy -d cozy_cabin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cozy_cabin_pgdata:
